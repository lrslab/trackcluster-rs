[package]
name = "trackcluster-rs"
version = "0.2.0"
edition = "2021"
rust-version = "1.90"
autobins = false
default-run = "trackcluster"
description = "Pure-Rust long-read isoform clustering and counting pipeline."
license = "MIT OR Apache-2.0"
readme = "README.md"
authors = ["runsheng"]
repository = "https://github.com/lrslab/trackcluster-rs"
homepage = "https://github.com/lrslab/trackcluster-rs"
documentation = "https://docs.rs/trackcluster-rs"
keywords = ["bioinformatics", "genomics", "isoform", "nanopore", "long-reads"]
categories = ["science", "command-line-utilities"]
exclude = [
    "rust-toolchain.toml",
    "todo*.md",
    "docs/PUBLISH.md",
    "docs/PERFORMANCE.md",
    "docs/design/**",
]

[dependencies]
anyhow = "1.0.103"
clap = { version = "4.5.27", features = ["derive"] }
csv = "1.3"
flate2 = "1.1"
noodles-bam = "0.89.0"
noodles-bgzf = "0.47.0"
noodles-sam = "0.85.0"
same-file = "1.0.6"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
thiserror = "2.0.11"

[features]
index-binned = []

[dev-dependencies]
proptest = "1.6.0"
criterion = { version = "0.5.1", features = ["html_reports"] }

[build-dependencies]
sha2 = "0.10.9"

[[bin]]
name = "trackcluster"
path = "src/bin/trackcluster.rs"

[[bin]]
name = "clusterj_batch"
path = "src/bin/clusterj_batch.rs"

[[bench]]
name = "perf"
harness = false
