name: ci

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - name: "Guard: no bedtools/subprocess in Rust"
        run: |
          if rg -n 'bedtools|subprocess' src tests; then
            echo "Found forbidden strings in Rust sources (bedtools/subprocess)"
            exit 1
          fi
      - run: cargo test --all --all-features
