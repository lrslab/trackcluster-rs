name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.90.0
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: "Guard: no external process execution in runtime Rust"
        run: |
          if rg -n 'std::process::Command|process::Command|Command::new' src; then
            echo "Found forbidden external-process usage in runtime Rust sources"
            exit 1
          fi
      - run: cargo test --locked --all --all-features
      - run: cargo bench --locked --all-features --no-run
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --locked --no-deps --all-features
      - run: cargo package --locked

      - name: Smoke-test packaged binaries
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          version=$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[0].version')
          mkdir -p target/package-unpacked target/package-install
          tar -xzf "target/package/trackcluster-rs-${version}.crate" -C target/package-unpacked
          cargo install --locked \
            --path "target/package-unpacked/trackcluster-rs-${version}" \
            --root target/package-install
          bin_dir="$PWD/target/package-install/bin"
          "$bin_dir/trackcluster" --version
          "$bin_dir/trackcluster" --help
          "$bin_dir/clusterj_batch" --version
          "$bin_dir/clusterj_batch" --help
          smoke_root=$(mktemp -d)
          "$bin_dir/trackcluster" flow \
            --reads tests/fixtures/reads.bed \
            --reference tests/fixtures/ref.bed \
            --output-root "$smoke_root" \
            --prefix smoke \
            --threads 1 \
            --force
          test -s "$smoke_root/smoke_isoform.bed"
          grep -Eq $'^git_commit\t[0-9a-f]{40}$' \
            "$smoke_root/clusterj_batch_summary.txt"
          grep -Eq $'^source_fingerprint\tsha256:[0-9a-f]{64}$' \
            "$smoke_root/clusterj_batch_summary.txt"

          mod_smoke_root=$(mktemp -d)
          printf 'sample\tgroup\treads\nS1\tcontrol\t%s/tests/fixtures/reads.bed\n' \
            "$PWD" > "$mod_smoke_root/samples.tsv"
          printf '%b\n' \
            'assay_id\tsample\tread_id\tchrom\tpos0\tstrand\tmod_code\tprobability\tobservation_state\tcontext\tsource_transcript_id\tsource_pos0' \
            'a1\tS1\tS1::read_trunc\tchr1\t125\t+\tA+a\t0.9\texplicit_probability\tNA\tNA\tNA' \
            > "$mod_smoke_root/observations.tsv"
          printf '%s\n' \
            '{"schema_version":1,"assay_id":"a1","caller":"packaged-smoke","caller_version":"1","model_id":"synthetic","chemistry":"RNA004","candidate_rule":"all-context-A","source_emission_threshold":null,"source_site_filter":"none","candidate_observations_complete":true,"provenance_status":"user_declared","implicit_skip_policy":"not_applicable","coordinate_source":"synthetic_genomic","read_id_mapping":"sample_prefixed","source_files":[]}' \
            > "$mod_smoke_root/assay.json"
          printf 'sample\tassay_id\tobservations\tassay_metadata\tcoverage_bam\nS1\ta1\t%s\t%s\tNA\n' \
            "$mod_smoke_root/observations.tsv" "$mod_smoke_root/assay.json" \
            > "$mod_smoke_root/mod_samples.tsv"
          "$bin_dir/trackcluster" flow \
            --manifest "$mod_smoke_root/samples.tsv" \
            --reference tests/fixtures/ref.bed \
            --output-root "$mod_smoke_root/output" \
            --prefix pooled \
            --threads 1 \
            --max-reads-per-gene 0 \
            --force \
            --mod-manifest "$mod_smoke_root/mod_samples.tsv" \
            --mod-analysis-threshold a1=0.5
          current="$mod_smoke_root/output/pooled.mod.current.json"
          test "$(jq -r '.complete' "$current")" = true
          run_id=$(jq -r '.run_id' "$current")
          test -s "$mod_smoke_root/output/pooled.mod.generations/$run_id/manifest.json"
          test -s "$mod_smoke_root/output/pooled.isoform_mod_sites.tsv"
          test -s "$mod_smoke_root/output/pooled.isoform_mod_design.tsv"

          package_summary="$smoke_root/clusterj_batch_summary.txt"
          package_commit=$(awk -F '\t' '$1 == "git_commit" { print $2; exit }' \
            "$package_summary")
          package_fingerprint=$(awk -F '\t' '$1 == "source_fingerprint" { print $2; exit }' \
            "$package_summary")

          unpacked_root="target/package-unpacked/trackcluster-rs-${version}"
          printf '\n// CI source-fingerprint tamper probe.\n' >> "$unpacked_root/src/lib.rs"
          mkdir -p target/package-install-tampered target/package-build-tampered
          CARGO_TARGET_DIR="$PWD/target/package-build-tampered" \
            cargo install --locked --force \
              --path "$unpacked_root" \
              --root target/package-install-tampered
          tampered_bin_dir="$PWD/target/package-install-tampered/bin"
          tampered_root=$(mktemp -d)
          "$tampered_bin_dir/trackcluster" flow \
            --reads tests/fixtures/reads.bed \
            --reference tests/fixtures/ref.bed \
            --output-root "$tampered_root" \
            --prefix smoke \
            --threads 1 \
            --force
          tampered_summary="$tampered_root/clusterj_batch_summary.txt"
          grep -Eq $'^git_commit\t[0-9a-f]{40}$' "$tampered_summary"
          grep -Eq $'^source_fingerprint\tsha256:[0-9a-f]{64}$' "$tampered_summary"
          tampered_commit=$(awk -F '\t' '$1 == "git_commit" { print $2; exit }' \
            "$tampered_summary")
          tampered_fingerprint=$(awk -F '\t' '$1 == "source_fingerprint" { print $2; exit }' \
            "$tampered_summary")
          test "$tampered_commit" = "$package_commit"
          test "$tampered_fingerprint" != "$package_fingerprint"

      - name: Install cargo-audit
        if: matrix.os == 'ubuntu-latest'
        run: cargo install cargo-audit --locked --version 0.22.1
      - name: Audit dependencies
        if: matrix.os == 'ubuntu-latest'
        run: cargo audit
