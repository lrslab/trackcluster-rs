name: Scheduled performance

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  representative-benchmarks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.90.0

      - name: Compile all benchmarks
        run: cargo bench --locked --all-features --no-run

      - name: Run Criterion suite
        run: cargo bench --locked --all-features --bench perf -- --noplot

      - name: Run large overlap probe with peak RSS
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/time -v \
            cargo test --locked --release --test perf_overlap_large \
              -- --ignored --nocapture \
            2>&1 | tee target/performance-probe.log

      - name: Retain benchmark history
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: performance-${{ github.run_id }}-${{ github.sha }}
          path: |
            target/criterion
            target/performance-probe.log
          retention-days: 90
